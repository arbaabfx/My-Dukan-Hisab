A.dsum=()=>{const T=day0(),B=allB().filter(b=>b.ts>=T&&b.ts<T+DAY&&bOK(b)),m={},ex=sum(D.exp.filter(e=>e.ts>=T&&e.ts<T+DAY),'amt');B.forEach(b=>b.items.forEach(i=>{m[i.name]=(m[i.name]||0)+i.price*i.qty}));
 const top=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,3),by=p=>sum(B.filter(b=>b.pay===p),'total');
 wa(D.shop.phone||'',`*Daily Summary* — ${D.shop.name||'Store'}\nDate: ${new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}\n\nBills: ${B.length}\nSales: *${R(sum(B,'total'))}*\nProfit: ${R(sum(B,bprofit))}\nExpenses: ${R(ex)}\n\nCash ${R(by('Cash'))} · UPI ${R(by('UPI'))} · Card ${R(by('Card'))} · Udhaar ${R(by('Udhaar'))}${top.length?'\n\nTop items:\n'+top.map((x,k)=>(k+1)+'. '+x[0]+' — '+R(x[1])).join('\n'):''}\n\nTotal Udhaar outstanding: ${R(sum(D.cust,c=>Math.max(0,c.bal)))}`)};
A.theme=t=>{D.shop.theme=t.dataset.k;save();applyTheme();t.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===t));toast('Theme badal gaya')};
A.big=()=>{D.shop.big=D.shop.big?0:1;save();applyTheme();go(cur)};
A.sample2=()=>{if(pChk()){const n=loadPre();toast(n+' items added');closeSheet();go('home')}else{A.sample();closeSheet()}};A.start=()=>{D.seen=1;if(pChk()){const n=loadPre();toast(n+' items added')}save();closeSheet();go('settings')};
})().catch(e=>{const d=document.createElement('pre');d.style.cssText='white-space:pre-wrap;padding:16px;color:#7a1230;font:14px system-ui';d.textContent='My Dukan Hisab could not start.\n'+(e&&e.message||e)+'\nPlease refresh the page or restore a backup.';document.body.prepend(d)});
</script></body></html>
